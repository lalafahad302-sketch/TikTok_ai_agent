<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Publisher</title>
</head>

<body>
  <h1>AI Content Publisher</h1>

  <p>Create and publish your content to TikTok.</p>

  <button>Connect TikTok</button>

  <br><br>

  <label>Select Video:</label>
  <input type="file" accept="video/*">

  <br><br>

  <label>Caption:</label>
  <br>
  <textarea placeholder="Write your caption"></textarea>

  <br><br>

  <button>Publish to TikTok</button>

  <hr>

  <p>Terms of Service</p>
  <p>Privacy Policy</p>
</body>
</html>
